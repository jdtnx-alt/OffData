events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ensure APK files are served with the correct MIME type
    types {
        application/vnd.android.package-archive apk;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip only for text-based assets, NOT for binary/APK files
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve landing page
        location / {
            try_files $uri $uri/ /index.html;
        }

        # APK downloads — disable gzip, force download with proper headers
        location ~* \.apk$ {
            root /usr/share/nginx/html;
            gzip off;
            add_header Content-Type "application/vnd.android.package-archive";
            add_header Content-Disposition 'attachment; filename="offdata.apk"';
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Serve other files in /downloads/ folder
        location /downloads/ {
            root /usr/share/nginx/html;
            gzip off;
            add_header Cache-Control "no-cache";
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}

